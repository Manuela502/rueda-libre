<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
</head>

<body>
    <header>
        <nav>
            <h2>Navegación principal</h2>
            <ul>
                <li><a href="../index.html">Pagina principal</a></li>
                <li><a href="./tarifas.html">Tarifas</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Reserva tu bicicleta</h1>
        <a href="mailto:hola@ruedalibre.example">Escribenos aqui
        </a>
        <h2>Horario de atención</h2>

        <dl>
            <dt>lunes y martes</dt>
            <dd>no prestamos servicio</dd>
            <dt>miercoles a viernes</dt>
            <dd>8:00 am a 4:00 pm</dd>
            <dt>sabados, domingos y festivos</dt>
            <dd>10:00 am a 8:00 pm</dd>
        </dl>

        <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Tus datos</legend>
                    <p>
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3">
                    </p>
                    <p>
                        <label for="correo">Correo electronico</label>
                        <input type="email" id="correo" name="correo" required>
                    </p>
                    <p>
                        <label for="telefono">Celular</label>
                        <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}"
                            title="Escribe 10 numeros, sin espacios">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Tu alquiler</legend>
                    <p>
                        <label for="fecha">Fecha de alquiler</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>
                </fieldset>
                <fieldset>
                    <p>
                        <input type="checkbox" id="confirmar" name="confirmar" required>
                        <label for="confirmar">Confirmo los datos de mi reserva</label>
                    </p>
                </fieldset>
                <p><button type= "submit"> Enviar formulario </button></p>
            </form>
        </section>

    </main>

    <footer>
        <h3>Ruta libre</h3>
        <a href="mailto:hola@ruedalibre.example">correo</a>
        <p>Copyright © 2026</p>


</body>

</html>
